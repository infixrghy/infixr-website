name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          # Node ≥24: native TS type stripping (build.ts runs unflagged) +
          # stable fs.glob (lint.ts). Matches local dev (v26).
          node-version: 26
          cache: npm

      # Explicit, locked install. `npm ci` installs exactly what
      # package-lock.json records (versions + integrity) — for an exact-pinned
      # prerelease (effect@4.0.0-beta.x) that reproducibility is what keeps a
      # clean CI checkout building the same artifact every time.
      - name: Install dependencies (locked)
        run: npm ci

      - name: Build site (src → public)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
